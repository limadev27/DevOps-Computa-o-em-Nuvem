# nginx.conf
# Serve os arquivos do site e encaminha /api para o backend Node.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker. Com isso o nginx não falha ao iniciar
    # caso o nome "backend" ainda não exista (ex.: no compose da VPS).
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
