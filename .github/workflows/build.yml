name: Build Docker

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Construir imagem
        run: docker build -t meu-site .
      - name: testar imagens
        run: docker images
     